<script>
    // ==========================================
    // UI 制御 & マッピング
    // ==========================================
    const HL_MAPPING = {
        'search': { in: 'search-in', count: 'search-count' },
        'cac-start': { in: 'cac-start-in', count: 'cac-start-count' },
        'cac-end': { in: 'cac-end-in', count: 'cac-end-count' },
        'pr': { in: 'pr-in', count: 'pr-count' },
        'replace-find': { in: 'replace-find-in', count: 'replace-find-count' },
        'del-1': { in: 'del-in-1', count: 'del-1-count' },
        'del-2': { in: 'del-in-2', count: 'del-2-count' }
    };

    let activeIndices = {
        'search': 0, 'cac-start': 0, 'cac-end': 0, 'pr': 0, 'replace-find': 0, 'del-1': 0, 'del-2': 0
    };

    let excludedMatchKeys = {
        'search': new Set(), 'cac-start': new Set(), 'cac-end': new Set(), 'pr': new Set(),
        'replace-find': new Set(), 'del-1': new Set(), 'del-2': new Set()
    };

    function clearExcludes(ctx = null) {
        if (ctx) excludedMatchKeys[ctx].clear();
        else Object.values(excludedMatchKeys).forEach(set => set.clear());
    }

    function renderSmartInputs() {
        const create = (id, label, ph) => `
        <div class="smart-input-group" id="${id}" onfocusin="handleFocusIn('${id}')">
            <div class="smart-input-header">
                <span class="smart-input-label">${label}</span>
                <div class="mode-switch">
                    <button type="button" class="btn-mode word active" onclick="switchInputMode('${id}', 'word')">単語</button>
                    <button type="button" class="btn-mode text" onclick="switchInputMode('${id}', 'text')">文章</button>
                </div>
            </div>
            <div class="smart-input-body">
                <input type="text" class="smart-input input-word active" placeholder="${ph}" oninput="handleSmartInput('${id}')">
                <textarea class="smart-input input-text" placeholder="${ph} (改行可)" oninput="handleSmartInput('${id}')"></textarea>
            </div>
        </div>`;

        document.getElementById('search-container').innerHTML = create('search-in', '検索/PA (例:？記号＆あ？）)', '探す・TSM(あ〜。)');
        document.getElementById('cac-start-container').innerHTML = create('cac-start-in', '始まりの文字', '開始地点');
        document.getElementById('cac-end-container').innerHTML = create('cac-end-in', '終わりの文字', '終了地点');
        document.getElementById('pr-container').innerHTML = create('pr-in', 'PR対象 (例: 色＜？青？＞＜黄＞)', '対象を指定 (＜＞は交換マーカー)');
        document.getElementById('replace-find-container').innerHTML = create('replace-find-in', '探す文字 (PA/TSM/OPT対応)', '探す文字列 (例: あ＃2＆？漢字？＃）う)');
        document.getElementById('replace-to-container').innerHTML = create('replace-to-in', '変える文字', '変える文字列');
        document.getElementById('del-container-1').innerHTML = create('del-in-1', '消す文字 1 (PA/TSM対応)', '消去する文字列');
        document.getElementById('del-container-2').innerHTML = create('del-in-2', '消す文字 2 (PA/TSM対応)', '消去する文字列');
    }

    function getInputValue(id) {
        const group = document.getElementById(id);
        if (!group) return "";
        const isWord = group.querySelector('.btn-mode.word').classList.contains('active');
        return isWord ? group.querySelector('.input-word').value : group.querySelector('.input-text').value;
    }
    
    function setInputValue(id, val) {
        const group = document.getElementById(id);
        if (!group) return;
        group.querySelector('.input-word').value = val;
        group.querySelector('.input-text').value = val;
    }

    function switchInputMode(id, mode) {
        const group = document.getElementById(id);
        group.querySelectorAll('.btn-mode').forEach(b => b.classList.remove('active'));
        group.querySelector(`.btn-mode.${mode}`).classList.add('active');
        group.querySelectorAll('.smart-input').forEach(i => i.classList.remove('active'));
        const targetInput = group.querySelector(`.input-${mode}`);
        targetInput.classList.add('active');
        
        const otherMode = mode === 'word' ? 'text' : 'word';
        targetInput.value = group.querySelector(`.input-${otherMode}`).value;
        targetInput.focus();
    }

    function handleSmartInput(id) {
        const group = document.getElementById(id);
        const isWord = group.querySelector('.btn-mode.word').classList.contains('active');
        const val = isWord ? group.querySelector('.input-word').value : group.querySelector('.input-text').value;
        if (isWord) group.querySelector('.input-text').value = val;
        else group.querySelector('.input-word').value = val;
        
        const contextKey = Object.keys(HL_MAPPING).find(key => HL_MAPPING[key].in === id);
        if (contextKey) {
            clearExcludes(contextKey); 
            activeIndices[contextKey] = 0;
            setHighlightContext(contextKey);
        }
    }

    function handleFocusIn(id) {
        const contextKey = Object.keys(HL_MAPPING).find(key => HL_MAPPING[key].in === id);
        if (contextKey) setHighlightContext(contextKey);
    }

    // CARのファイル読み込み
    function loadCarFile(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            setInputValue('car-replace-in', ev.target.result);
        };
        reader.readAsText(file);
        e.target.value = "";
    }

    // ==========================================
    // ★ PA/TSM/PR/OPT 構文解析エンジン
    // ==========================================
    const PATTERNS_PA = {
        '数字': '0-9０-９',
        '記号': '\\x21-\\x2f\\x3a-\\x40\\x5b-\\x60\\x7b-\\x7e！-／：-＠［-｀｛-｝\u2000-\u206F\u2500-\u257F\u25A0-\u25FF\u2190-\u21FF\u2200-\u22FF\u2600-\u26FF\u3000-\u303F：・¥￥ー', // 追加分含む
        'ローマ字': 'a-zA-Zａ-ｚＡ-Ｚ',
        '日本語': 'ぁ-んァ-ヶー一-龠',
        '漢字': '一-龠',
        'ひらがな': 'ぁ-ん',
        'カタカナ': 'ァ-ヶー',
        '空白': '\\s\\u3000'
    };

    function escapeRegExp(string) {
        return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function parseKeyword(keyword, isPR = false) {
        let tokens = [];
        if (isPR) {
            let parts = keyword.split(/(＜.*?＞)/);
            for (let p of parts) {
                if (!p) continue;
                if (p.startsWith('＜') && p.endsWith('＞')) {
                    tokens.push({ type: 'swap', text: p.substring(1, p.length - 1) });
                } else {
                    tokens.push({ type: 'normal', text: p });
                }
            }
        } else {
            tokens.push({ type: 'normal', text: keyword });
        }
        
        let finalTokens = [];
        for (let tok of tokens) {
            let parts = tok.text.split(/(？.*?？）|＃.*?＃）|〜)/);
            for (let p of parts) {
                if (!p) continue;
                if (p === '〜') {
                    finalTokens.push({ type: 'tsm', text: '〜', isSwap: tok.type === 'swap' });
                } else if (p.startsWith('？') && p.endsWith('？）')) {
                    finalTokens.push({ type: 'pa', text: p, isSwap: tok.type === 'swap' });
                } else if (p.startsWith('＃') && p.endsWith('＃）')) {
                    finalTokens.push({ type: 'opt', text: p, isSwap: tok.type === 'swap' }); // ★OPT追加
                } else {
                    finalTokens.push({ type: 'text', text: p, isSwap: tok.type === 'swap' });
                }
            }
        }
        return finalTokens;
    }

    function parseInnerClass(innerStr) {
        let excludeStr = "";
        let match = innerStr.match(/（(.*?)）$/);
        if (match) {
            excludeStr = match[1];
            innerStr = innerStr.replace(/（.*?）$/, '');
        }
        let types = innerStr.split('＆');
        let charClass = "";
        for (let t of types) {
            let cleanT = t.replace(/^？(.*)？$/, '$1'); // ネスト対応
            if (PATTERNS_PA[cleanT]) {
                charClass += PATTERNS_PA[cleanT];
            } else {
                // 普通の文字もエスケープして許容する
                charClass += escapeRegExp(cleanT);
            }
        }
        
        let negLookahead = "";
        if (excludeStr) {
            let excludes = excludeStr.split(/[\s\u3000]+/).filter(s => s);
            if (excludes.length > 0) {
                negLookahead = `(?!${excludes.map(escapeRegExp).join('|')})`;
            }
        }
        return { charClass, negLookahead };
    }

    function buildSearchRegexFromTokens(tokens) {
        if (tokens.length === 0) return null;
        let regexStr = "";
        
        for (let tok of tokens) {
            let partRegex = "";
            if (tok.type === 'tsm') {
                partRegex = "[\\s\\S]*?"; 
            } else if (tok.type === 'pa') {
                let inner = tok.text.substring(1, tok.text.length - 2); 
                let { charClass, negLookahead } = parseInnerClass(inner);
                if (charClass) {
                    partRegex = `(?:${negLookahead}[${charClass}])+`;
                } else {
                    partRegex = escapeRegExp(tok.text);
                }
            } else if (tok.type === 'opt') {
                let inner = tok.text.substring(1, tok.text.length - 2); 
                let { charClass, negLookahead } = parseInnerClass(inner);
                if (charClass) {
                    partRegex = `(?:${negLookahead}[${charClass}])*`; // 0回以上（無視/複数）
                } else {
                    partRegex = escapeRegExp(tok.text);
                }
            } else {
                partRegex = escapeRegExp(tok.text);
            }
            regexStr += `(${partRegex})`;
        }
        try { return new RegExp(regexStr, 'g'); } catch(e) { return null; }
    }

    function getMatches(text, keyword, isPR = false) {
        if (!keyword) return [];
        let tokens = parseKeyword(keyword, isPR);
        let regex = buildSearchRegexFromTokens(tokens);
        if (!regex) return [];
        
        let matches = [];
        let match;
        regex.lastIndex = 0;
        while ((match = regex.exec(text)) !== null) {
            if (match[0].length === 0) { regex.lastIndex++; continue; }
            matches.push({ 
                start: match.index, 
                end: match.index + match[0].length, 
                text: match[0],
                groups: match, 
                tokens: tokens 
            });
        }
        return matches;
    }

    function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    // ==========================================
    // ハイライト・ナビゲーション & 除外トグル
    // ==========================================
    let hlContext = null;

    function setHighlightContext(ctx) {
        hlContext = ctx;
        updateHighlight();
    }

    function updateHighlight() {
        const editor = document.getElementById('editor');
        const highlights = document.getElementById('highlights');
        let text = editor.value;
        
        updateHighlightUI(text);

        if (!hlContext) {
            editor.classList.remove('highlight-mode');
            highlights.innerHTML = escapeHtml(text);
            return;
        }
        
        const inId = HL_MAPPING[hlContext].in;
        let keyword = getInputValue(inId);
        
        if (!keyword) {
            editor.classList.remove('highlight-mode');
            highlights.innerHTML = escapeHtml(text);
            return;
        }

        editor.classList.add('highlight-mode');
        let isPR = (hlContext === 'pr');
        let matches = getMatches(text, keyword, isPR);
        
        if (matches.length === 0) {
            highlights.innerHTML = `<span class="backdrop-text">${escapeHtml(text)}</span>`;
            return;
        }
        
        let validMatches = matches.filter(m => !excludedMatchKeys[hlContext].has(`${m.start}_${m.end}`));
        let activeIdx = activeIndices[hlContext];
        if (activeIdx >= validMatches.length) activeIdx = Math.max(0, validMatches.length - 1);
        activeIndices[hlContext] = activeIdx;
        
        let resultHTML = "";
        let lastIndex = 0;
        matches.forEach((match) => {
            resultHTML += `<span class="backdrop-text">${escapeHtml(text.substring(lastIndex, match.start))}</span>`;
            let matchText = escapeHtml(text.substring(match.start, match.end));
            
            let matchKey = `${match.start}_${match.end}`;
            let isExcluded = excludedMatchKeys[hlContext].has(matchKey);
            let markClass = 'match';
            
            if (isExcluded) {
                markClass = 'excluded';
            } else {
                let validIdx = validMatches.indexOf(match);
                if (validIdx === activeIdx) markClass = 'active';
            }
            
            resultHTML += `<mark class="${markClass}">${matchText}</mark>`;
            lastIndex = match.end;
        });
        resultHTML += `<span class="backdrop-text">${escapeHtml(text.substring(lastIndex))}</span>`;
        
        highlights.innerHTML = resultHTML;
        scrollToActiveMatch();
    }

    function updateHighlightUI(text) {
        Object.keys(HL_MAPPING).forEach(key => {
            let keyword = getInputValue(HL_MAPPING[key].in);
            let isPR = (key === 'pr');
            let m = getMatches(text, keyword, isPR);
            let validLen = m.filter(match => !excludedMatchKeys[key].has(`${match.start}_${match.end}`)).length;
            let disp = document.getElementById(HL_MAPPING[key].count);
            if(disp) disp.innerText = validLen > 0 ? `${activeIndices[key] + 1}/${validLen}` : `0/0`;
        });
    }

    function navIndex(dir, type) {
        const inId = HL_MAPPING[type].in;
        const keyword = getInputValue(inId);
        if (!keyword) return;
        
        const text = document.getElementById('editor').value;
        let isPR = (type === 'pr');
        let matches = getMatches(text, keyword, isPR);
        let validMatches = matches.filter(m => !excludedMatchKeys[type].has(`${m.start}_${m.end}`));
        if (validMatches.length === 0) return;
        
        activeIndices[type] += dir;
        if (activeIndices[type] < 0) activeIndices[type] = validMatches.length - 1;
        if (activeIndices[type] >= validMatches.length) activeIndices[type] = 0;
        
        setHighlightContext(type);
    }

    const editorEl = document.getElementById('editor');
    const backdropEl = document.getElementById('backdrop');
    const highlightsEl = document.getElementById('highlights');

    editorEl.addEventListener('scroll', () => {
        backdropEl.scrollTop = editorEl.scrollTop;
        backdropEl.scrollLeft = editorEl.scrollLeft;
    });

    function scrollToActiveMatch() {
        const activeMark = highlightsEl.querySelector('mark.active');
        if (activeMark) {
            const markTop = activeMark.offsetTop;
            const markBottom = markTop + activeMark.offsetHeight;
            const eTop = editorEl.scrollTop;
            const eHeight = editorEl.clientHeight;
            if (markTop < eTop + 20) editorEl.scrollTop = markTop - 20;
            else if (markBottom > eTop + eHeight - 20) editorEl.scrollTop = markBottom - eHeight + 20;
        }
    }

    editorEl.addEventListener('click', function(e) {
        if (!hlContext) return; 
        
        let pos = this.selectionStart;
        if (this.selectionStart !== this.selectionEnd) return; 
        
        const inId = HL_MAPPING[hlContext].in;
        let keyword = getInputValue(inId);
        if (!keyword) return;
        
        let isPR = (hlContext === 'pr');
        let matches = getMatches(this.value, keyword, isPR);
        let clickedMatch = matches.find(m => pos >= m.start && pos <= m.end);
        
        if (clickedMatch) {
            let matchKey = `${clickedMatch.start}_${clickedMatch.end}`;
            if (excludedMatchKeys[hlContext].has(matchKey)) {
                excludedMatchKeys[hlContext].delete(matchKey); 
            } else {
                excludedMatchKeys[hlContext].add(matchKey); 
            }
            updateHighlight();
        }
    });

    function updateCharCount() {
        let text = document.getElementById('editor').value;
        if (document.getElementById('ignore-space-chk').checked) {
            text = text.replace(/[\s\u3000]/g, '');
        }
        document.getElementById('char-count').innerText = text.length + '文字';
    }

    // ★ Undo/Redo用のデバウンストラッキング
    let typingTimer;
    function onEditorInput() {
        clearExcludes(); 
        autoSave();
        updateHighlight();
        updateCharCount();
        
        clearTimeout(typingTimer);
        typingTimer = setTimeout(() => {
            saveTypingState();
        }, 800);
    }
    
    function saveTypingState() {
        const memo = memos.find(m => m.id === activeMemoId);
        if (!memo) return;
        // 変更があればスタックに積む
        if (memo.undoStack.length === 0 || memo.undoStack[memo.undoStack.length - 1].content !== memo.content) {
            memo.undoStack.push({ content: memo.content, history: [...memo.history] });
            memo.redoStack = [];
            updateCtrlButtons();
        }
    }

    // ==========================================
    // 実行ロジック
    // ==========================================
    
    // PR: キャプチャグループの順序入れ替え
    function runPR() {
        let keyword = getInputValue('pr-in');
        if (!keyword) return alert("PRエラー：交換対象を入力してください。");
        let content = document.getElementById('editor').value;
        
        let matches = getMatches(content, keyword, true);
        let validMatches = matches.filter(m => !excludedMatchKeys['pr'].has(`${m.start}_${m.end}`));
        
        if (validMatches.length === 0) return alert("PRエラー：対象が見つかりません。");
        
        let tokens = parseKeyword(keyword, true);
        let swapIndices = [];
        for (let i = 0; i < tokens.length; i++) {
            if (tokens[i].isSwap) swapIndices.push(i);
        }
        if (swapIndices.length < 2) return alert("PRエラー：入力欄に＜＞で囲まれた交換対象が2つ以上必要です。");
        
        let idx1 = swapIndices[0];
        let idx2 = swapIndices[1];
        
        saveState();
        let changeCount = 0;
        
        for (let i = validMatches.length - 1; i >= 0; i--) {
            let m = validMatches[i];
            let replaced = "";
            for (let j = 0; j < tokens.length; j++) {
                let groupIdx = j + 1;
                if (j === idx1) groupIdx = idx2 + 1;
                else if (j === idx2) groupIdx = idx1 + 1;
                
                replaced += m.groups[groupIdx] || "";
            }
            if (replaced !== m.text) {
                content = content.substring(0, m.start) + replaced + content.substring(m.end);
                changeCount++;
            }
        }
        
        if (changeCount > 0) {
            applyChanges(content, `PR: 部分交換 (${changeCount}件)`);
            alert(`PR完了：${changeCount}件の指定箇所を入れ替えました。`);
        } else {
            const memo = memos.find(m => m.id === activeMemoId);
            memo.undoStack.pop();
            alert("PRエラー：交換によって文字列が変化しませんでした。");
        }
    }

    // CAC / C / CAR 共通基盤
    function copyToClipboard(text) {
        const ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px';
        document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); } catch (err) { console.error(err); }
        document.body.removeChild(ta);
    }

    function executeCutBase(onSuccess) {
        let content = document.getElementById('editor').value;
        let startStr = getInputValue('cac-start-in');
        let endStr = getInputValue('cac-end-in');
        
        if (!startStr || !endStr) { alert("エラー：開始と終了を入力してください。"); return null; }
        
        let sMatchesAll = getMatches(content, startStr);
        let eMatchesAll = getMatches(content, endStr);
        let sMatches = sMatchesAll.filter(m => !excludedMatchKeys['cac-start'].has(`${m.start}_${m.end}`));
        let eMatches = eMatchesAll.filter(m => !excludedMatchKeys['cac-end'].has(`${m.start}_${m.end}`));
        
        if (sMatches.length === 0) { alert("エラー：有効な開始文字列が見つかりません。"); return null; }
        if (eMatches.length === 0) { alert("エラー：有効な終了文字列が見つかりません。"); return null; }
        
        let sIdx = activeIndices['cac-start'] < sMatches.length ? activeIndices['cac-start'] : 0;
        let eIdx = activeIndices['cac-end'] < eMatches.length ? activeIndices['cac-end'] : 0;
        
        let startMatch = sMatches[sIdx];
        let endMatch = eMatches[eIdx];
        
        let startInclude = document.getElementById('cac-start-include').checked;
        let endInclude = document.getElementById('cac-end-include').checked;
        
        let cutStartPos = startInclude ? startMatch.start : startMatch.end;
        let cutEndPos = endInclude ? endMatch.end : endMatch.start;
        
        if (cutStartPos >= cutEndPos) {
            alert("エラー：終了位置が開始位置より前にあります。");
            return null;
        }
        
        saveState();
        let targetText = content.substring(cutStartPos, cutEndPos);
        return { content, cutStartPos, cutEndPos, targetText };
    }

    function runCAC(doCopy) {
        let res = executeCutBase();
        if (!res) return;
        
        let newContent = res.content.substring(0, res.cutStartPos) + res.content.substring(res.cutEndPos);
        if (doCopy) copyToClipboard(res.targetText);
        
        let actionName = doCopy ? "CAC (切取＆コピー)" : "C (切取のみ)";
        applyChanges(newContent, `${actionName}: ${res.targetText.length}文字`);
        alert(`${actionName} 完了`);
    }

    function runCAR() {
        let res = executeCutBase();
        if (!res) return;
        
        let replaceStr = getInputValue('car-replace-in');
        let newContent = res.content.substring(0, res.cutStartPos) + replaceStr + res.content.substring(res.cutEndPos);
        
        applyChanges(newContent, `CAR (切取＆置換): ${res.targetText.length}文字 -> ${replaceStr.length}文字`);
        alert(`CAR完了：指定範囲を切り取り、新しい文字に置き換えました。`);
    }


    // ==========================================
    // 既存機能・状態管理・ジャンプバグ修正
    // ==========================================
    let memos = []; 
    let activeMemoId = null;
    let deletedMemos = [];

    const DELETE_PATTERNS = {
        num: { regex: /[0-9０-９]/g, label: "数字" },
        sym: { regex: /[\x21-\x2f\x3a-\x40\x5b-\x60\x7b-\x7e]|[！-／：-＠［-｀｛-｝]|[\u2000-\u206F\u2500-\u257F\u25A0-\u25FF\u2190-\u21FF\u2200-\u22FF\u2600-\u26FF\u3000-\u303F：・¥￥ー]/g, label: "記号" },
        roma: { regex: /[a-zA-Z]/g, label: "ローマ字" },
        jp: { regex: /[ぁ-んァ-ヶー一-龠]/g, label: "日本語" },
        kan: { regex: /[一-龠]/g, label: "漢字" },
        hira: { regex: /[ぁ-ん]/g, label: "ひらがな" },
        kata: { regex: /[ァ-ヶー]/g, label: "カタカナ" },
        space: { regex: /[\s\u3000]/g, label: "空白" }
    };

    window.onload = () => {
        renderSmartInputs();
        const saved = localStorage.getItem('ultimate_memo_data_v2');
        if (saved) {
            memos = JSON.parse(saved);
            activeMemoId = memos[0].id;
        } else {
            createNewMemo();
        }
        const savedDeleted = localStorage.getItem('ultimate_memo_deleted_v2');
        if (savedDeleted) deletedMemos = JSON.parse(savedDeleted);

        renderTabs();
        loadActiveMemo();
        updateDeletedUI();
        setupEditorEnhancements();
    };

    function createNewMemo() {
        const id = Date.now();
        const newMemo = { id: id, title: "新規メモ", content: "", history: [], undoStack: [], redoStack: [] };
        memos.push(newMemo); activeMemoId = id;
        renderTabs(); loadActiveMemo(); autoSave();
    }

    function loadActiveMemo() {
        const memo = memos.find(m => m.id === activeMemoId);
        if (!memo) return;
        document.getElementById('editor').value = memo.content;
        document.getElementById('memo-title').value = memo.title;
        updateHistoryUI(); updateCtrlButtons();
        updateCharCount();
        clearExcludes();
        if (document.getElementById('preview-container').style.display === 'flex') endTest();
        updateHighlight();
    }

    function renderTabs() {
        const bar = document.getElementById('tabs-bar');
        const addButton = bar.querySelector('.btn-add-tab');
        bar.querySelectorAll('.tab').forEach(t => t.remove());

        memos.forEach(memo => {
            const tab = document.createElement('div');
            tab.className = `tab ${memo.id === activeMemoId ? 'active' : ''}`;
            tab.onclick = () => switchMemo(memo.id);
            tab.innerHTML = `<span>${memo.title || '無題'}</span><button class="btn-close-tab" onclick="closeTab(event, ${memo.id})">×</button>`;
            bar.insertBefore(tab, addButton);
        });
    }

    function switchMemo(id) { activeMemoId = id; renderTabs(); loadActiveMemo(); }

    function closeTab(e, id) {
        e.stopPropagation();
        if (memos.length === 1) return;
        const targetIndex = memos.findIndex(m => m.id === id);
        if (targetIndex !== -1) {
            const deleted = memos.splice(targetIndex, 1)[0];
            deletedMemos.unshift(deleted);
            if (deletedMemos.length > 10) deletedMemos.pop();
            saveDeletedStates(); updateDeletedUI();
        }
        if (activeMemoId === id) activeMemoId = memos[0].id;
        renderTabs(); loadActiveMemo(); autoSave();
    }

    function updateTabTitle() {
        const memo = memos.find(m => m.id === activeMemoId);
        if (memo) { memo.title = document.getElementById('memo-title').value; renderTabs(); autoSave(); }
    }

    function autoSave() {
        const memo = memos.find(m => m.id === activeMemoId);
        if (memo) memo.content = document.getElementById('editor').value;
        localStorage.setItem('ultimate_memo_data_v2', JSON.stringify(memos));
        const status = document.getElementById('save-status');
        status.innerText = "保存中..."; setTimeout(() => { status.innerText = "保存済み"; }, 800);
    }

    function saveState() {
        const memo = memos.find(m => m.id === activeMemoId);
        if (!memo) return;
        memo.undoStack.push({ content: document.getElementById('editor').value, history: [...memo.history] });
        memo.redoStack = []; updateCtrlButtons();
    }

    function runDelete() {
        const memo = memos.find(m => m.id === activeMemoId);
        let content = document.getElementById('editor').value;
        let info = [];
        saveState();

        ['del-1', 'del-2'].forEach(key => {
            const inId = HL_MAPPING[key].in;
            const val = getInputValue(inId);
            if (val) {
                let matches = getMatches(content, val);
                let validMatches = matches.filter(m => !excludedMatchKeys[key].has(`${m.start}_${m.end}`));
                if (validMatches.length > 0) {
                    for (let i = validMatches.length - 1; i >= 0; i--) {
                        let m = validMatches[i];
                        content = content.substring(0, m.start) + content.substring(m.end);
                    }
                    info.push(`「${val}」`);
                    setInputValue(inId, "");
                }
            }
        });

        document.querySelectorAll('.checkbox-grid input:checked').forEach(chk => {
            const p = DELETE_PATTERNS[chk.value];
            if (content.match(p.regex)) {
                content = content.replace(p.regex, "");
                info.push(`[${p.label}]`);
            }
            chk.checked = false;
        });

        if (info.length > 0) applyChanges(content, `消去: ${info.join(", ")}`);
        else { memo.undoStack.pop(); alert("対象が見つかりません"); }
    }

    function runReplace() {
        const findVal = getInputValue('replace-find-in');
        const replaceVal = getInputValue('replace-to-in');
        let content = document.getElementById('editor').value;

        if (!findVal) return alert("探す単語を入力してください");
        
        let matches = getMatches(content, findVal);
        let validMatches = matches.filter(m => !excludedMatchKeys['replace-find'].has(`${m.start}_${m.end}`));

        if (validMatches.length > 0) {
            saveState();
            for (let i = validMatches.length - 1; i >= 0; i--) {
                let m = validMatches[i];
                content = content.substring(0, m.start) + replaceVal + content.substring(m.end);
            }
            applyChanges(content, `置換: 「${findVal}」→「${replaceVal}」`);
            setInputValue('replace-find-in', "");
            setInputValue('replace-to-in', "");
        } else {
            alert("見つかりませんでした");
        }
    }

    // ★変更: DOMの更新時にカーソル位置を極力維持する
    function applyChanges(newContent, message) {
        const memo = memos.find(m => m.id === activeMemoId);
        const time = new Date().toLocaleTimeString();
        memo.content = newContent;
        memo.history.push(`[${time}] ${message}`);
        
        const editor = document.getElementById('editor');
        const oldStart = editor.selectionStart;
        editor.value = newContent;
        
        // 文字の増減に関わらず、なるべく元のカーソル位置付近を維持する
        editor.selectionStart = Math.min(oldStart, newContent.length);
        editor.selectionEnd = editor.selectionStart;
        
        updateHistoryUI(); updateCtrlButtons(); onEditorInput();
    }

    function undo() {
        const memo = memos.find(m => m.id === activeMemoId);
        if (!memo || memo.undoStack.length === 0) return;
        memo.redoStack.push({ content: memo.content, history: [...memo.history] });
        const last = memo.undoStack.pop();
        memo.content = last.content; memo.history = last.history;
        loadActiveMemo(); autoSave();
    }

    function redo() {
        const memo = memos.find(m => m.id === activeMemoId);
        if (!memo || memo.redoStack.length === 0) return;
        memo.undoStack.push({ content: memo.content, history: [...memo.history] });
        const next = memo.redoStack.pop();
        memo.content = next.content; memo.history = next.history;
        loadActiveMemo(); autoSave();
    }

    function updateHistoryUI() {
        const memo = memos.find(m => m.id === activeMemoId);
        const histDiv = document.getElementById('history');
        if (!memo || !memo.history.length) { histDiv.innerHTML = '<div style="color:#555">履歴はありません</div>'; return; }
        histDiv.innerHTML = memo.history.map(log => `<div class="history-item">${log}</div>`).reverse().join("");
    }

    function updateCtrlButtons() {
        const memo = memos.find(m => m.id === activeMemoId);
        if (!memo) return;
        document.getElementById('undo-btn').disabled = memo.undoStack.length === 0;
        document.getElementById('redo-btn').disabled = memo.redoStack.length === 0;
    }

    function loadFile(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            saveState(); 
            const editor = document.getElementById('editor');
            editor.value = ev.target.result;
            editor.selectionStart = editor.selectionEnd = 0; // ファイル読み込み時は先頭へ
            onEditorInput();
        };
        reader.readAsText(file);
    }

    function download(type) {
        const memo = memos.find(m => m.id === activeMemoId);
        let content = type === 'text' ? memo.content : "■ 履歴\n" + memo.history.join("\n");
        let name = type === 'text' ? `${memo.title}.txt` : "history.txt";
        const blob = new Blob([content], { type: 'text/plain' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob); a.download = name; a.click();
    }

    function restoreMemo(id) {
        const index = deletedMemos.findIndex(m => m.id === id);
        if (index !== -1) {
            const restored = deletedMemos.splice(index, 1)[0];
            memos.push(restored); activeMemoId = restored.id;
            saveDeletedStates(); updateDeletedUI(); renderTabs(); loadActiveMemo(); autoSave();
        }
    }

    function updateDeletedUI() {
        const container = document.getElementById('deleted-memos');
        if (deletedMemos.length === 0) { container.innerHTML = '<div style="color:#555">削除履歴はありません</div>'; return; }
        container.innerHTML = deletedMemos.map(memo => `
            <div class="history-item"><button class="restore-btn" onclick="restoreMemo(${memo.id})">復元</button>
            <div style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${memo.title || '無題'}</div></div>
        `).join("");
    }

    function saveDeletedStates() { localStorage.setItem('ultimate_memo_deleted_v2', JSON.stringify(deletedMemos)); }

    function runHTML() {
        const code = document.getElementById('editor').value;
        const blob = new Blob([code], { type: 'text/html' });
        document.getElementById('preview').src = URL.createObjectURL(blob);
        document.getElementById('editor').style.display = 'none';
        document.getElementById('backdrop').style.display = 'none';
        document.getElementById('preview-container').style.display = 'flex';
    }

    function endTest() {
        document.getElementById('preview').src = 'about:blank';
        document.getElementById('preview-container').style.display = 'none';
        document.getElementById('editor').style.display = 'block';
        document.getElementById('backdrop').style.display = 'block';
        if (document.getElementById('preview-container').classList.contains('fullscreen')) togglePreviewFullscreen();
    }

    function togglePreviewFullscreen() { document.getElementById('preview-container').classList.toggle('fullscreen'); }

    // ★ジャンプバグ対策用変数
    let savedSelectionStart = 0;
    let savedSelectionEnd = 0;

    function setupEditorEnhancements() {
        const editor = document.getElementById('editor');
        editor.addEventListener('touchstart', function(e) { this.focus(); }, {passive: true});
        
        editor.addEventListener('keydown', function(e) {
            if (e.key === 'Tab') {
                e.preventDefault();
                saveTypingState(); // Tab挿入前に手動で履歴を積む
                const start = this.selectionStart, end = this.selectionEnd;
                this.value = this.value.substring(0, start) + "    " + this.value.substring(end);
                this.selectionStart = this.selectionEnd = start + 4;
                onEditorInput();
            }
        });
        
        // ★ エディタのフォーカスが外れた際に位置を記憶
        editor.addEventListener('blur', function() {
            savedSelectionStart = this.selectionStart;
            savedSelectionEnd = this.selectionEnd;
        });

        // ★ メインエリアクリック時にエディタへフォーカスを当て、必要ならカーソル位置を復元
        const workspace = document.querySelector('.workspace');
        workspace.addEventListener('click', function(e) {
            if (document.activeElement !== editor) {
                editor.focus();
                // 内部処理によってキャレットが先頭にリセットされてしまった場合のみ、直前の位置に戻す
                setTimeout(() => {
                    if (editor.selectionStart === 0 && savedSelectionStart > 0) {
                        editor.selectionStart = savedSelectionStart;
                        editor.selectionEnd = savedSelectionEnd;
                    }
                }, 10);
            }
        });
    }
</script>
